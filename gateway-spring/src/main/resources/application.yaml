server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:3000"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: subscribers-subscribe
              uri: http://subscribers-service-container:8081
              predicates:
                - Path=/v1/subscribe
                - Method=POST
              filters:
                - Jwt
                - AddUserId

            - id: subscribers-unsubscribe
              uri: http://subscribers-service-container:8081
              predicates:
                - Path=/v1/unsubscribe
                - Method=POST
              filters:
                - Jwt
                - AddUserId

            - id: subscribers-get-following
              uri: http://subscribers-service-container:8081
              predicates:
                - Path=/v1/following
                - Method=GET
              filters:
                - Jwt
                - AddUserId

            - id: subscribers-get-followers
              uri: http://subscribers-service-container:8081
              predicates:
                - Path=/v1/followers
                - Method=GET
              filters:
                - Jwt
                - AddUserId

            - id: post-creator-create-post
              uri: http://post-creator-container:8082
              predicates:
                - Path=/v1/posts
                - Method=POST
              filters:
                - Jwt
                - AddUserId

            - id: feed-get-user-feed
              uri: http://feed-container:8086
              predicates:
                - Path=/v1/feed/**
                - Method=GET
              filters:
                - Jwt
                - AddUserId

            - id: users-auth
              uri: http://users-container:8084
              predicates:
                - Path=/v1/auth/**

jwt:
  secret: "${JWT_SECRET}"