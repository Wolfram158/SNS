httpServer {
  publicApiHttpPort = 8082
  telemetry {
    logging {
      enabled = true
      stacktrace = true
    }
  }
}

db {
  r2dbcUrl = ${R2DBC_URL}
  r2dbcUrl = "r2dbc:postgresql://postgres-posts:5432/posts_db"
  jdbcUrl = "jdbc:postgresql://postgres-posts:5432/posts_db"

  username = ${R2DBC_USER}
  username = "postgres"

  password = ${R2DBC_PASS}
  password = "postgres"

  poolName = "post-creator-pool"
  maxPoolSize = 10
}

flyway {
  locations = ["db/migration"]
  enabled = true
  executeInTransaction = true
}

s3 {
  endpoint = ${S3_ENDPOINT}
  endpoint = "http://minio:9000"

  region = "us-east-1"
  bucket = "posts-bucket"

  accessKey = ${S3_ACCESS_KEY}
  accessKey = "minioadmin"

  secretKey = ${S3_SECRET_KEY}
  secretKey = "minioadmin"
}